[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-swiss-tax-statement"
dynamic = ["version"]
description = "Generate eCH-0196 E-Steuerauszug from broker CSV exports"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.0",
    "lxml>=5.0",
    "reportlab>=4.0",
    "pdf417gen>=0.7",
    "pypdf>=4.0",
    "Pillow>=10.0",
]

[project.scripts]
open-swiss-tax-statement = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "zxingcpp>=2.0",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]
build = [
    "pyinstaller>=6.0",
]
ci = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = ["if __name__", "if TYPE_CHECKING", "pragma: no cover"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
